name: Actualizar charts
on:
  schedule:
    - cron: "30 6,14 * * *"   # dos pasadas al día; si no hay chart nuevo no duplica
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests beautifulsoup4
      - run: python fetch_kworb.py
      - run: |
          git config user.name "chart-bot"; git config user.email "bot@users.noreply.github.com"
          git add history.csv && (git diff --cached --quiet || git commit -m "Charts $(date -u +%F)" && git push)
